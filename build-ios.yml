name: Build Pikmin Pilot Stage 11.5.4.18 iPad Foreground Recovery

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: pikminpilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-development-release:
    runs-on: macos-15-intel
    env:
      APP_BUNDLE_ID: com.woodypikmin.pikminpilot
      TUNNEL_BUNDLE_ID: com.woodypikmin.pikminpilot.tunnel
      XCTRUNNER_BUNDLE_ID: com.woodypikmin.pikminpilot.runner.xctrunner
      P12_PASSWORD: ${{ secrets.APPLE_DEV_P12_PASSWORD }}
      APPLE_DEV_P12_B64: ${{ secrets.APPLE_DEV_P12_B64 }}
      PROFILE_APP_B64: ${{ secrets.PROFILE_APP_B64 }}
      PROFILE_TUNNEL_B64: ${{ secrets.PROFILE_TUNNEL_B64 }}
      PROFILE_XCTRUNNER_B64: ${{ secrets.PROFILE_XCTRUNNER_B64 }}
      PAIRING_RECORD_B64: ${{ secrets.PAIRING_RECORD_B64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required GitHub Secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_DEV_P12_B64 P12_PASSWORD PROFILE_APP_B64 PROFILE_TUNNEL_B64 PROFILE_XCTRUNNER_B64; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret/env: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the 5 Stage 11.1 GitHub Actions secrets first."
            exit 2
          fi
          echo "All Stage 11.1 signing secrets are present."

      - name: Decode certificate and provisioning profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          mapping = {
              'APPLE_DEV_P12_B64': '.signing/AppleDevelopment.p12',
              'PROFILE_APP_B64': '.signing/App.mobileprovision',
              'PROFILE_TUNNEL_B64': '.signing/Tunnel.mobileprovision',
              'PROFILE_XCTRUNNER_B64': '.signing/XCTRunner.mobileprovision',
          }
          for env, path in mapping.items():
              raw = os.environ.get(env, '')
              if not raw:
                  raise SystemExit(f'missing {env}')
              try:
                  data = base64.b64decode(raw, validate=True)
              except Exception as exc:
                  raise SystemExit(f'{env} is not valid Base64: {exc}')
              Path(path).write_bytes(data)
              print(f'decoded {env} -> {path} ({len(data)} bytes)')
          PY
          chmod 600 .signing/AppleDevelopment.p12 .signing/*.mobileprovision

      - name: Validate provisioning profiles and capabilities
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/profile_tools.py summary .signing/App.mobileprovision APP \
            --expect-bundle-id "$APP_BUNDLE_ID" --require-packet-tunnel | tee SigningReport.txt
          python3 scripts/profile_tools.py summary .signing/Tunnel.mobileprovision TUNNEL \
            --expect-bundle-id "$TUNNEL_BUNDLE_ID" --require-packet-tunnel | tee -a SigningReport.txt
          python3 scripts/profile_tools.py summary .signing/XCTRunner.mobileprovision XCTRUNNER \
            --expect-bundle-id "$XCTRUNNER_BUNDLE_ID" | tee -a SigningReport.txt

          python3 scripts/profile_tools.py extract-entitlements .signing/App.mobileprovision .signing/App.entitlements \
            --expect-bundle-id "$APP_BUNDLE_ID" --require-packet-tunnel
          python3 scripts/profile_tools.py extract-entitlements .signing/Tunnel.mobileprovision .signing/Tunnel.entitlements \
            --expect-bundle-id "$TUNNEL_BUNDLE_ID" --require-packet-tunnel
          python3 scripts/profile_tools.py extract-entitlements .signing/XCTRunner.mobileprovision .signing/XCTRunner.entitlements \
            --expect-bundle-id "$XCTRUNNER_BUNDLE_ID"
          python3 scripts/profile_tools.py metadata .signing/XCTRunner.mobileprovision PikminPilotEmbeddedRunnerMetadata.plist

      - name: Import Apple Development identity into temporary keychain
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/pikminpilot-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import .signing/AppleDevelopment.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          # Make the temporary keychain visible to normal codesign identity lookup.
          # Keep the existing login/system search list too.
          EXISTING_KEYCHAINS=()
          while IFS= read -r kc; do
            kc="${kc//\"/}"
            [ -n "$kc" ] && EXISTING_KEYCHAINS+=("$kc")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # codesign is more reliable in CI when addressed by the certificate SHA-1
          # instead of the display name (which can otherwise report "no identity found"
          # even though security find-identity sees the certificate/private-key pair).
          IDENTITY_LINE="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep '"Apple Development:' | head -1 || true)"
          IDENTITY_SHA1="$(printf '%s\n' "$IDENTITY_LINE" | awk '{print $2}')"
          IDENTITY_NAME="$(printf '%s\n' "$IDENTITY_LINE" | sed -n 's/.*"\(Apple Development:.*\)"/\1/p')"
          if [ -z "$IDENTITY_SHA1" ]; then
            echo "No Apple Development code-signing identity found in the imported P12."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            security find-identity -v -p codesigning || true
            exit 3
          fi
          echo "SIGN_IDENTITY=$IDENTITY_SHA1" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY_NAME=$IDENTITY_NAME" >> "$GITHUB_ENV"
          echo "Signing identity imported: $IDENTITY_NAME [$IDENTITY_SHA1]" | tee -a SigningReport.txt
          echo "Visible code-signing identities after keychain search-list update:" | tee -a SigningReport.txt
          security find-identity -v -p codesigning | tee -a SigningReport.txt

      - name: Build IDevice XCFramework on runner
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/build-idevice-xcframework.sh
          scripts/build-idevice-xcframework.sh
          test -f Vendor/IDevice/IDevice.xcframework/ios-arm64/libidevice_ffi.a

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euxo pipefail
          brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euxo pipefail
          xcodegen generate
          xcodebuild -project PikminPilot.xcodeproj -list

      - name: Build unsigned host app plus PacketTunnelProvider
        shell: bash
        run: |
          set -euxo pipefail
          # RC3: force the actual host/tunnel build settings at xcodebuild time.
          # Do not rely only on project.yml/XcodeGen defaults: RC2 proved that the
          # generated product could still resolve to Host 1.0(1) / Tunnel 1153.
          xcodebuild \
            -project PikminPilot.xcodeproj \
            -scheme PikminPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-host \
            MARKETING_VERSION=11.5.4.18 \
            CURRENT_PROJECT_VERSION=1158 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP="build-host/Build/Products/Release-iphoneos/PikminPilot.app"
          TUNNEL="$APP/PlugIns/PikminPilotTunnel.appex"
          test -d "$APP"
          test -d "$TUNNEL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$APP_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TUNNEL/Info.plist")" = "$TUNNEL_BUNDLE_ID"

          echo "Raw Xcode product versions before normalization:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$TUNNEL/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$TUNNEL/Info.plist" || true

          # Final product-level normalization. This happens before any signing,
          # therefore the exact Info.plists that iOS will install are signed later.
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 11.5.4.18' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1158' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 11.5.4.18' "$TUNNEL/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 1158' "$TUNNEL/Info.plist"

          HOST_MARKETING="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          HOST_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          TUNNEL_MARKETING="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$TUNNEL/Info.plist")"
          TUNNEL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$TUNNEL/Info.plist")"
          echo "FINAL host version=$HOST_MARKETING build=$HOST_BUILD"
          echo "FINAL tunnel version=$TUNNEL_MARKETING build=$TUNNEL_BUILD"
          test "$HOST_MARKETING" = "11.5.4.18"
          test "$HOST_BUILD" = "1158"
          test "$TUNNEL_MARKETING" = "11.5.4.18"
          test "$TUNNEL_BUILD" = "1158"

      - name: Build current unsigned XCUITest Runner
        shell: bash
        run: |
          set -euxo pipefail
          # Runner remains the validated 1153-xfix line even though the Host/Tunnel
          # install build is 1158. Command-line overrides prevent version bleed.
          xcodebuild \
            -project PikminPilot.xcodeproj \
            -scheme PikminPilot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-runner \
            build-for-testing \
            MARKETING_VERSION=11.5.4.18 \
            CURRENT_PROJECT_VERSION=1153 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          RUNNER_APP="$(find build-runner/Build/Products -type d -name '*-Runner.app' -print -quit)"
          test -n "$RUNNER_APP"
          TEST_BUNDLE="$(find "$RUNNER_APP/PlugIns" -maxdepth 1 -type d -name '*.xctest' -print -quit)"
          test -n "$TEST_BUNDLE"
          echo "RUNNER_APP=$RUNNER_APP" >> "$GITHUB_ENV"
          echo "TEST_BUNDLE=$TEST_BUNDLE" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_APP/Info.plist" | tee RunnerBuiltBundleIdentifier.txt
          RUNNER_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_APP/Info.plist")"
          echo "Built Runner wrapper CFBundleVersion=$RUNNER_BUILD (1153-xfix Runner source retained; wrapper metadata is not used as the revision gate)"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TEST_BUNDLE/Info.plist" | tee XCTestBundleIdentifier.txt

      - name: Recursively sign current Runner locally on GitHub macOS
        shell: bash
        run: |
          set -euo pipefail

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "codesign identity SHA-1: $SIGN_IDENTITY"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning | grep -F "$SIGN_IDENTITY"

          rm -rf SignedRunnerStage Payload
          mkdir -p SignedRunnerStage Payload
          cp -R "$RUNNER_APP" SignedRunnerStage/
          SIGNED_RUNNER_APP="$(find SignedRunnerStage -maxdepth 1 -type d -name '*-Runner.app' -print -quit)"
          test -n "$SIGNED_RUNNER_APP"
          SIGNED_TEST_BUNDLE="$(find "$SIGNED_RUNNER_APP/PlugIns" -maxdepth 1 -type d -name '*.xctest' -print -quit)"
          test -n "$SIGNED_TEST_BUNDLE"

          ACTUAL_RUNNER_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SIGNED_RUNNER_APP/Info.plist")"
          ACTUAL_TEST_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SIGNED_TEST_BUNDLE/Info.plist")"
          echo "Runner bundle id: $ACTUAL_RUNNER_ID" | tee -a SigningReport.txt
          echo "Nested XCTest bundle id: $ACTUAL_TEST_ID" | tee -a SigningReport.txt
          test "$ACTUAL_RUNNER_ID" = "$XCTRUNNER_BUNDLE_ID"

          # The old Windows/go-ios fix succeeded because every nested executable was
          # signed before the outer .xctrunner. Do the same entirely on the GitHub
          # macOS host. No physical iPhone is needed or expected in CI.
          while IFS= read -r dylib; do
            echo "Signing dylib: $dylib"
            /usr/bin/codesign \
              --force \
              --sign "$SIGN_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --timestamp=none \
              "$dylib"
          done < <(find "$SIGNED_RUNNER_APP" -type f -name '*.dylib' -print | sort)

          while IFS= read -r framework; do
            echo "Signing framework: $framework"
            /usr/bin/codesign \
              --force \
              --sign "$SIGN_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --timestamp=none \
              "$framework"
          done < <(find "$SIGNED_RUNNER_APP" -type d -name '*.framework' -print | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2-)

          # A UI-test bundle is nested code, not an independently installed app.
          # The proven Stage 9.x Runner had an empty entitlement dictionary here.
          # Sign it with the same Apple Development identity, but no mobileprovision.
          /usr/bin/codesign \
            --force \
            --sign "$SIGN_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --generate-entitlement-der \
            --timestamp=none \
            "$SIGNED_TEST_BUNDLE"

          # Only the installable outer .xctrunner receives the Apple provisioning
          # profile and its profile-derived entitlements.
          cp .signing/XCTRunner.mobileprovision "$SIGNED_RUNNER_APP/embedded.mobileprovision"
          /usr/bin/codesign \
            --force \
            --sign "$SIGN_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements .signing/XCTRunner.entitlements \
            --generate-entitlement-der \
            --timestamp=none \
            "$SIGNED_RUNNER_APP"

          /usr/bin/codesign --verify --deep --strict --verbose=4 "$SIGNED_RUNNER_APP"
          /usr/bin/codesign -dv --verbose=4 "$SIGNED_RUNNER_APP" 2>&1 | grep -E 'Identifier=|TeamIdentifier=' | tee -a SigningReport.txt
          /usr/bin/codesign -d --entitlements :- "$SIGNED_RUNNER_APP" > SignedRunnerEntitlements.plist
          /usr/bin/codesign -d --entitlements :- "$SIGNED_TEST_BUNDLE" > SignedXCTestEntitlements.plist

          cp -R "$SIGNED_RUNNER_APP" Payload/
          rm -f PikminPilotRunner-Stage11.5.4.18-SIGNED.ipa
          /usr/bin/zip -qry PikminPilotRunner-Stage11.5.4.18-SIGNED.ipa Payload
          rm -rf Payload SignedRunnerStage

          test -s PikminPilotRunner-Stage11.5.4.18-SIGNED.ipa
          unzip -t PikminPilotRunner-Stage11.5.4.18-SIGNED.ipa >/dev/null
          echo "Runner recursively signed locally on GitHub macOS; no device discovery was used." | tee -a SigningReport.txt

      - name: Embed newly signed Runner into host
        shell: bash
        run: |
          set -euxo pipefail
          APP="build-host/Build/Products/Release-iphoneos/PikminPilot.app"
          cp PikminPilotRunner-Stage11.5.4.18-SIGNED.ipa "$APP/PikminPilotEmbeddedRunner.ipa"
          cp PikminPilotEmbeddedRunnerMetadata.plist "$APP/PikminPilotEmbeddedRunnerMetadata.plist"
          test -s "$APP/PikminPilotEmbeddedRunner.ipa"
          test -s "$APP/PikminPilotEmbeddedRunnerMetadata.plist"
          shasum -a 256 "$APP/PikminPilotEmbeddedRunner.ipa" | tee EmbeddedRunnerSHA256.txt

      - name: Sign PacketTunnelProvider and Pikmin Pilot host
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning | grep -F "$SIGN_IDENTITY"
          APP="build-host/Build/Products/Release-iphoneos/PikminPilot.app"
          TUNNEL="$APP/PlugIns/PikminPilotTunnel.appex"

          # Optional personal-device mode: embed an existing RPPairing record so
          # first launch needs no Files picker. This secret is intentionally NOT
          # required because a pairing record is device-specific and sensitive.
          if [ -n "${PAIRING_RECORD_B64:-}" ]; then
            python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ.get("PAIRING_RECORD_B64", "")
          data = base64.b64decode(raw, validate=True)
          if not data:
              raise SystemExit("PAIRING_RECORD_B64 decoded to an empty file")
          Path("build-host/Build/Products/Release-iphoneos/PikminPilot.app/PikminPilotEmbeddedRPPairing.plist").write_bytes(data)
          print(f"Embedded private RPPairing record ({len(data)} bytes)")
          PY
          else
            echo "PAIRING_RECORD_B64 not configured; first clean install will use the one-time Files picker."
          fi

          cp .signing/Tunnel.mobileprovision "$TUNNEL/embedded.mobileprovision"
          /usr/bin/codesign \
            --force \
            --sign "$SIGN_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements .signing/Tunnel.entitlements \
            --generate-entitlement-der \
            --timestamp=none \
            "$TUNNEL"

          cp .signing/App.mobileprovision "$APP/embedded.mobileprovision"
          /usr/bin/codesign \
            --force \
            --sign "$SIGN_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements .signing/App.entitlements \
            --generate-entitlement-der \
            --timestamp=none \
            "$APP"

          codesign --verify --deep --strict --verbose=4 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Identifier=|TeamIdentifier=' | tee -a SigningReport.txt
          codesign -dv --verbose=4 "$TUNNEL" 2>&1 | grep -E 'Identifier=|TeamIdentifier=' | tee -a SigningReport.txt
          codesign -d --entitlements :- "$APP" > SignedAppEntitlements.plist
          codesign -d --entitlements :- "$TUNNEL" > SignedTunnelEntitlements.plist
          grep -q 'packet-tunnel-provider' SignedAppEntitlements.plist
          grep -q 'packet-tunnel-provider' SignedTunnelEntitlements.plist

      - name: Package fully signed single IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="build-host/Build/Products/Release-iphoneos/PikminPilot.app"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry PikminPilot-Stage11.5.4.18-FULLY-SIGNED-DEVELOPMENT.ipa Payload
          rm -rf Payload
          unzip -t PikminPilot-Stage11.5.4.18-FULLY-SIGNED-DEVELOPMENT.ipa >/dev/null
          unzip -l PikminPilot-Stage11.5.4.18-FULLY-SIGNED-DEVELOPMENT.ipa | grep -F 'PikminPilotEmbeddedRunner.ipa'
          unzip -l PikminPilot-Stage11.5.4.18-FULLY-SIGNED-DEVELOPMENT.ipa | grep -F 'PikminPilotTunnel.appex'
          shasum -a 256 PikminPilot-Stage11.5.4.18-FULLY-SIGNED-DEVELOPMENT.ipa | tee PikminPilotSignedSHA256.txt

      - name: Build clean end-user release kit
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PAIRING_RECORD_B64:-}" ]; then
            PAIRING_MODE="PERSONALIZED"
          else
            PAIRING_MODE="GENERIC"
          fi
          export PIKMIN_RELEASE_VERSION="11.5.4.18"
          export PIKMIN_RELEASE_BUILD="1158"
          export PIKMIN_PAIRING_MODE="$PAIRING_MODE"
          # Invoke through bash so GitHub/ZIP executable-bit loss cannot break packaging.
          bash scripts/make-release-kit.sh \
            PikminPilot-Stage11.5.4.18-FULLY-SIGNED-DEVELOPMENT.ipa \
            PikminPilot-11.5.4.18-END-USER-KIT
          /usr/bin/zip -qry \
            PikminPilot-11.5.4.18-END-USER-KIT.zip \
            PikminPilot-11.5.4.18-END-USER-KIT
          unzip -t PikminPilot-11.5.4.18-END-USER-KIT.zip >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-11.5.4.18-END-USER-KIT
          path: PikminPilot-11.5.4.18-END-USER-KIT.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-Stage11.5.4.18-FULLY-SIGNED-DEVELOPMENT
          path: |
            PikminPilot-Stage11.5.4.18-FULLY-SIGNED-DEVELOPMENT.ipa
            PikminPilotRunner-Stage11.5.4.18-SIGNED.ipa
            PikminPilotSignedSHA256.txt
            EmbeddedRunnerSHA256.txt
            RunnerBuiltBundleIdentifier.txt
            XCTestBundleIdentifier.txt
            PikminPilotEmbeddedRunnerMetadata.plist
            SignedAppEntitlements.plist
            SignedTunnelEntitlements.plist
            SignedRunnerEntitlements.plist
            SignedXCTestEntitlements.plist
            SigningReport.txt

      - name: Cleanup temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf .signing || true
