name: "Pikmin Pilot Universal Setup - Dynamic Release"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universal-runtime:
    runs-on: windows-latest
    env:
      PIKMIN_BACKEND_URL: ${{ vars.PIKMIN_BACKEND_URL }}
      EXPECTED_PAIR_SHA256: '0edd085d0e98b07f80e94d67737d7e8e150c1e14d63b1170e77b4d54e8b5f847'
    steps:
      - uses: actions/checkout@v4

      - name: DIAGNOSTIC - prove Universal dynamic source is checked out
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Commit: $(git rev-parse HEAD)"
          Write-Host "=== first 40 lines of WindowsSetup/src/main.rs ==="
          Get-Content 'WindowsSetup/src/main.rs' | Select-Object -First 40
          Write-Host "=== embedded IPA search ==="
          $bad = Select-String -Path 'WindowsSetup/src/main.rs' -Pattern 'EMBEDDED_IPA|PikminPilot\.ipa' -AllMatches
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_.Line }
            throw 'STOP: This checkout still contains the OLD embedded-IPA source. Replace WindowsSetup/src/main.rs with Universal dynamic source.'
          }
          $src = Get-Content 'WindowsSetup/src/main.rs' -Raw
          if ($src -notmatch 'COMPILED_BACKEND_URL' -or $src -notmatch 'request_cloud_job' -or $src -notmatch 'setup_protocol: 2') {
            throw 'STOP: This is not the Universal dynamic-release main.rs.'
          }
          if (-not $env:PIKMIN_BACKEND_URL) {
            throw 'STOP: B repo variable PIKMIN_BACKEND_URL is empty.'
          }
          Write-Host "Universal dynamic-release source confirmed. Backend URL is configured."

      - name: Verify pairing helper
        shell: pwsh
        run: |
          $pair = 'WindowsSetup/assets/PikminPilotPairingHelper.exe'
          $pairHash = (Get-FileHash $pair -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PairingHelper SHA256: $pairHash"
          if ($pairHash -ne $env:EXPECTED_PAIR_SHA256) { throw "Wrong pairing helper: $pairHash" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: WindowsSetup

      - name: Resolve exact idevice 0.1.61
        working-directory: WindowsSetup
        shell: pwsh
        run: |
          cargo generate-lockfile
          $tree = cargo tree -p idevice
          $tree
          if (($tree | Select-String -SimpleMatch 'idevice v0.1.61').Count -lt 1) { throw 'idevice pin changed' }

      - name: Build Universal dynamic-release EXE
        working-directory: WindowsSetup
        shell: pwsh
        run: cargo build --release --locked

      - name: Assemble delivery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force delivery | Out-Null
          Copy-Item WindowsSetup/target/release/PikminPilotSetup.exe delivery/PikminPilotSetup.exe
          Get-FileHash delivery/PikminPilotSetup.exe -Algorithm SHA256 | Format-List | Out-File delivery/SHA256.txt
          @"
          Pikmin Pilot Universal Setup.
          This EXE downloads the current release selected by the backend at runtime.
          App version is NOT compiled into this Setup.exe.
          It does NOT contain PikminPilot.ipa.
          "@ | Set-Content -Encoding UTF8 delivery/README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PikminPilot-Universal-Setup
          path: delivery
