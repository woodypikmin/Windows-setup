name: "PUBLISH - Pikmin Pilot Universal Setup (Render)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      PIKMIN_BACKEND_URL: ${{ vars.PIKMIN_BACKEND_URL }}
      EXPECTED_PAIR_SHA256: '0edd085d0e98b07f80e94d67737d7e8e150c1e14d63b1170e77b4d54e8b5f847'
      EXPECTED_SOURCE_MARKER: 'RC6_RENDER_STABLE_V1'
      STABLE_TAG: 'pikminpilot-setup-stable'
    steps:
      - uses: actions/checkout@v4

      - name: "Verify Render-stable Universal source"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'WindowsSetup/src/main.rs'
          if (-not (Test-Path $path)) { throw "Missing $path" }
          $src = Get-Content $path -Raw
          if (-not $src.Contains($env:EXPECTED_SOURCE_MARKER)) { throw 'Expected RC6_RENDER_STABLE_V1 source marker is missing.' }
          if ($src.Contains('EMBEDDED_IPA')) { throw 'Old embedded IPA source detected.' }
          if ($src.Contains("app_version: &'a str")) { throw 'Old request schema detected.' }
          if (-not $src.Contains('setup_protocol: u8')) { throw 'Universal setup_protocol field is missing.' }
          if (-not $env:PIKMIN_BACKEND_URL) { throw 'B repo variable PIKMIN_BACKEND_URL is empty.' }
          if (-not $env:PIKMIN_BACKEND_URL.StartsWith('https://')) { throw 'PIKMIN_BACKEND_URL must be HTTPS.' }
          if ($env:PIKMIN_BACKEND_URL.Contains('trycloudflare.com')) { throw 'Quick Tunnel URL is not allowed for the stable installer.' }
          Write-Host "Backend: $env:PIKMIN_BACKEND_URL"
          Write-Host 'PASS: Render-stable Universal source confirmed.'

      - name: "Verify known-good PairingHelper"
        shell: pwsh
        run: |
          $pair = 'WindowsSetup/assets/PikminPilotPairingHelper.exe'
          if (-not (Test-Path $pair)) { throw "Missing $pair" }
          $hash = (Get-FileHash $pair -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:EXPECTED_PAIR_SHA256) { throw "PairingHelper hash mismatch: $hash" }
          Write-Host "PairingHelper SHA256=$hash"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: WindowsSetup

      - name: "Lock exact idevice 0.1.61"
        working-directory: WindowsSetup
        shell: pwsh
        run: |
          cargo generate-lockfile
          $tree = cargo tree -p idevice
          $tree | Write-Host
          if (($tree | Select-String -SimpleMatch 'idevice v0.1.61').Count -lt 1) { throw 'idevice pin changed' }

      - name: "Build stable Universal Setup"
        working-directory: WindowsSetup
        shell: pwsh
        run: cargo build --release --locked

      - name: "Assemble release asset"
        shell: pwsh
        run: |
          $exe='WindowsSetup/target/release/PikminPilotSetup.exe'
          if (-not (Test-Path $exe)) { throw "Built EXE missing: $exe" }
          New-Item -ItemType Directory -Force delivery | Out-Null
          Copy-Item $exe delivery/PikminPilotSetup.exe
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256=$hash" | Set-Content -Encoding ASCII delivery/SHA256.txt
          @"
          Pikmin Pilot Universal Setup - Render Stable
          Client revision: RC6_RENDER_STABLE_V1
          Backend: $env:PIKMIN_BACKEND_URL
          App version is selected dynamically by the backend.
          IPA is NOT embedded in this executable.
          "@ | Set-Content -Encoding UTF8 delivery/README.txt
          Write-Host "PikminPilotSetup.exe SHA256=$hash"

      - name: "Publish / replace stable GitHub Release asset"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:STABLE_TAG
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'Pikmin Pilot Setup (Stable)' --notes 'Universal one-click Windows installer. The app version is selected dynamically by the backend.'
          }
          gh release upload $tag delivery/PikminPilotSetup.exe delivery/SHA256.txt delivery/README.txt --clobber
          Write-Host "Stable download: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/PikminPilotSetup.exe"
