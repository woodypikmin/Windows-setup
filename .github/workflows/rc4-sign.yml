name: RC4 Sign Provisioned IPA

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Cloud provisioning job id
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: macos-15
    env:
      JOB_ID: ${{ inputs.job_id }}
      BACKEND_URL: ${{ secrets.PIKMIN_BACKEND_URL }}
      BACKEND_TOKEN: ${{ secrets.PIKMIN_BACKEND_WORKFLOW_TOKEN }}
      BASELINE_RELEASE_TAG: pikminpilot-11.5.4.17
      BASELINE_IPA_ASSET: PikminPilot-11.5.4.17.ipa
    steps:
      - uses: actions/checkout@v4

      - name: Download baseline 11.5.4.17 IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work
          gh release download "$BASELINE_RELEASE_TAG" --pattern "$BASELINE_IPA_ASSET" --dir work --clobber
          mv "work/$BASELINE_IPA_ASSET" work/baseline.ipa
          test -s work/baseline.ipa

      - name: Download generated provisioning profiles from backend
        run: |
          set -euo pipefail
          for label in app tunnel runner; do
            curl --fail --show-error --silent \
              -H "Authorization: Bearer $BACKEND_TOKEN" \
              "$BACKEND_URL/internal/jobs/$JOB_ID/profiles/$label" \
              -o "work/$label.mobileprovision"
          done

      - name: Import Apple Development P12 into temporary keychain
        env:
          P12_B64: ${{ secrets.APPLE_DEV_P12_B64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEV_P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$P12_B64" | base64 --decode > work/signing.p12
          KEYCHAIN="$RUNNER_TEMP/pikminpilot.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import work/signing.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n '1s/.*"\(.*\)".*/\1/p')"
          test -n "$IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Re-sign App / Tunnel / Runner without changing bundle ids
        env:
          INPUT_IPA: ${{ github.workspace }}/work/baseline.ipa
          OUTPUT_IPA: ${{ github.workspace }}/work/PikminPilot.ipa
          PROFILE_APP: ${{ github.workspace }}/work/app.mobileprovision
          PROFILE_TUNNEL: ${{ github.workspace }}/work/tunnel.mobileprovision
          PROFILE_RUNNER: ${{ github.workspace }}/work/runner.mobileprovision
        run: bash CloudProvisioning/scripts/resign_ipa.sh

      - name: Upload signed IPA to provisioning backend
        run: |
          set -euo pipefail
          SHA="$(shasum -a 256 work/PikminPilot.ipa | awk '{print $1}')"
          curl --fail --show-error --silent \
            -X PUT \
            -H "Authorization: Bearer $BACKEND_TOKEN" \
            -H "X-IPA-SHA256: $SHA" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @work/PikminPilot.ipa \
            "$BACKEND_URL/internal/jobs/$JOB_ID/result"
          echo "Uploaded SHA256=$SHA"

      - name: Report failure to backend
        if: failure()
        run: |
          curl --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $BACKEND_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"message":"GitHub RC4 signing workflow failed; inspect Actions log."}' \
            "$BACKEND_URL/internal/jobs/$JOB_ID/failed" || true
